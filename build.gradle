plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "me.shedaniel.unified-publishing" version "0.1.+"
}

unifiedPublishing {
	project {
		displayName = "Terrain Slabs v$mod_version"
		changelog = file("$rootDir/CHANGELOG.md").text
		releaseType = "release"
		gameVersions = [minecraft_version]
		gameLoaders = ["fabric"]

		mainPublication(tasks.named("remapJar").get())

		/* Not yet architectury
		relations {
			depends {
				curseforge = "architectury-api"
				modrinth = "architectury-api"
			}
		}
		 */

        curseforge {
            token = System.getenv("CURSEFORGE_TOKEN")
            id = "1125437"
        }
        modrinth {
            token = System.getenv("MODRINTH_TOKEN")
            id = "SJu6sklj"
        }
	}
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://api.modrinth.com/maven" }
	maven {
		url = "https://maven.midnightdust.eu/releases"
	}
	maven { url = "https://maven.terraformersmc.com/releases" }
}

fabricApi {
	configureDataGeneration() {
		client = true
	}
}

sourceSets {
	client {
		java {
			srcDir "src/client/java"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	clientImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation include ("eu.midnightdust:midnightlib:${project.midnightlib_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}